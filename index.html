<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DM</title>
<style>
:root{--ink:#262626;--muted:#8e8e8e;--line:#efefef;--blue:#3797f0;--bg:#fff;--bubble:#efefef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink);background:#fafafa}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:620px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px #00000008;overflow:hidden}
.topbar{height:62px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:13px;background:#fff;z-index:2}
.back{border:0;background:none;font-size:25px;padding:4px 5px 4px 0;color:#262626}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);padding:2px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.headinfo{min-width:0;flex:1}.name{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:var(--muted);margin-top:3px}
.iconbtn{border:0;background:none;font-size:22px;padding:7px;color:#262626}.userbtn{font-size:18px}
.profile{padding:25px 16px 20px;text-align:center;border-bottom:1px solid var(--line)}
.bigavatar{width:82px;height:82px;border-radius:50%;margin:0 auto 11px;padding:3px;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}
.bigavatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.profile h2{font-size:14px;margin:0 0 5px}.profile p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.chat{flex:1;overflow-y:auto;padding:18px 15px 22px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.date{text-align:center;font-size:10px;color:#a8a8a8;margin:5px 0 12px}
.row{display:flex;align-items:flex-end;gap:7px;max-width:86%;animation:pop .16s ease-out}.row.me{align-self:flex-end;flex-direction:row-reverse}.row.bot{align-self:flex-start}
.miniavatar{width:25px;height:25px;border-radius:50%;background:#f2e9ef url('1795535148960.png') center/cover no-repeat;display:grid;place-items:center;font-size:10px;font-weight:700;color:#777;flex-shrink:0}
.bubble{padding:11px 14px;border-radius:20px;background:var(--bubble);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.me .bubble{background:linear-gradient(135deg,#3797f0,#7b61ff);color:#fff;border-bottom-right-radius:6px}
.bot .bubble{border-bottom-left-radius:6px}
.time{font-size:9px;color:#b0b0b0;margin:0 5px 3px;align-self:flex-end}
.delete-msg{border:0;background:transparent;color:#b8b8b8;font-size:15px;line-height:1;padding:4px 2px;margin:0 0 1px;align-self:flex-end;opacity:.75}.delete-msg:active{color:#e45b65;transform:scale(.92)}
.typing{display:flex;gap:4px;padding:14px 16px}.typing i{width:5px;height:5px;border-radius:50%;background:#999;animation:bounce .8s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.composer-wrap{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;flex-shrink:0}
.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid #dbdbdb;border-radius:25px;padding:6px 7px 6px 15px;min-height:44px}
#message{flex:1;resize:none;border:0;outline:0;max-height:110px;min-height:28px;padding:6px 0;background:transparent;font-size:14px;line-height:1.4;color:var(--ink)}
#message::placeholder{color:#aaa}
.send{border:0;border-radius:22px;background:var(--blue);color:white;font-size:13px;font-weight:650;padding:9px 15px;min-width:55px}.send:disabled{opacity:.4}
.bottomhint{text-align:center;font-size:10px;color:#b4b4b4;padding-top:7px}
.empty{margin:auto;text-align:center;color:#999;font-size:13px;line-height:1.7}
.modalback{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}.modalback.open{display:flex}#ruleModal{z-index:7}#lockModal{z-index:9}#cfgPrompt{min-height:110px}#systemRuleText{min-height:260px;line-height:1.55}
.modal{width:min(620px,100%);background:white;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{font-size:12px;color:#888;line-height:1.5;margin:0 0 16px}
.field{display:block;font-size:12px;font-weight:650;margin:13px 0 6px}.modal input,.modal textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:13px;outline-color:var(--blue)}.modal textarea{min-height:90px;resize:vertical}
.tabbar{display:flex;gap:7px;border-bottom:1px solid var(--line);margin:15px 0 12px}.tabbtn{flex:1;border:0;background:#f4f4f4;color:#777;padding:11px 8px;border-radius:10px 10px 0 0;font-size:13px;font-weight:650}.tabbtn.active{background:#262626;color:#fff}.userpanel{display:none}.userpanel.active{display:block}.userpanel textarea{min-height:190px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:17px}.actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:650}.save{background:#262626;color:#fff}.cancel{background:#f2f2f2;color:#333}
@keyframes bounce{to{transform:translateY(-4px);opacity:.45}}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:621px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border:1px solid #eee;border-radius:12px}.modalback{align-items:center}.modal{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" aria-label="뒤로">‹</button>
    <div class="avatar"><img src="1795535148960.png" alt="백재 프로필 사진"></div>
    <div class="headinfo"><div class="name" id="headName">백재하</div><div class="status" id="headStatus">활동 중</div></div>
    <button class="iconbtn userbtn" id="userProfileBtn" aria-label="사용자 정보">☻</button>
    <button class="iconbtn" id="profileBtn" aria-label="프로필 설정">ⓘ</button>
    <button class="iconbtn" id="moreBtn" aria-label="메뉴">⋯</button>
  </header>
  <section class="profile">
    <div class="bigavatar"><img src="1795535148960.png" alt="백재 프로필 사진"></div>
    <h2 id="profileName">백재하</h2>
    <p id="profileBio">백재하입니다.</p>
  </section>
  <main class="chat" id="chat">
    <div class="date">메시지</div>
    <div class="empty" id="welcome">아직 대화가 없어.<br>첫 메시지를 보내 봐!</div>
  </main>
  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea id="message" rows="1" placeholder="메시지 보내기..." autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">보내기</button>
    </form>
    <div class="bottomhint">대화 내용은 이 기기에 자동 저장돼</div>
  </div>
</div>

<div class="modalback" id="lockModal"><section class="modal"><h3>제작자 전용 설정</h3><p>백재하의 캐릭터 설정을 열람하려면 비밀번호를 입력해 줘.</p><label class="field" for="creatorPassword">비밀번호</label><input id="creatorPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력"><p id="lockError" style="display:none;color:#d44;margin:8px 0 0">비밀번호가 올바르지 않아.</p><div class="actions"><button class="cancel" id="cancelLock" type="button">취소</button><button class="save" id="unlockSettings" type="button">확인</button></div></section></div>

<div class="modalback" id="modalBack">
  <section class="modal">
    <h3>대화 설정</h3>
    <p>캐릭터 정보와 연결 설정은 열람만 가능해. API 키만 입력하거나 변경할 수 있어.</p>
    <label class="field" for="cfgName">캐릭터 이름</label><input id="cfgName" maxlength="30" readonly placeholder="예: 에이든">
    <label class="field" for="cfgBio">프로필 한 줄 소개</label><input id="cfgBio" maxlength="80" readonly placeholder="예: 말수가 적고 무심한 성격">
    <label class="field" for="cfgApi">API 주소</label><input id="cfgApi" type="url" readonly placeholder="https://api.openai.com/v1/chat/completions"><label class="field" for="cfgModel">모델 이름</label><input id="cfgModel" readonly placeholder="gpt-5.6-terra"><label class="field" for="cfgKey">API 키</label><input id="cfgKey" type="password" autocomplete="off" placeholder="API 키 입력">
    <label class="field" for="cfgPrompt">캐릭터 성격 / 말투 / 설정</label><textarea id="cfgPrompt" readonly placeholder="캐릭터의 성격, 말투, 관계, 배경 등을 적어 줘."></textarea>
    <div class="actions"><button class="cancel" id="openRuleEditor" type="button">시스템 규칙 보기</button><button class="cancel" id="closeModal" type="button">닫기</button><button class="save" id="saveConfig" type="button">API 키 저장</button></div>
  </section>
</div>

<div class="modalback" id="userModal"><section class="modal"><h3>사용자 정보</h3><p>작성한 유저 노트와 페르소나는 대화할 때마다 AI에게 함께 전달돼.</p><div class="tabbar" role="tablist"><button class="tabbtn active" id="noteTab" type="button" role="tab" aria-selected="true">유저 노트</button><button class="tabbtn" id="personaTab" type="button" role="tab" aria-selected="false">페르소나</button></div><div class="userpanel active" id="notePanel"><label class="field" for="userNoteText">USER NOTE</label><textarea id="userNoteText" placeholder="역할극에서 기억해야 할 사용자 관련 정보나 현재 상황을 적어 줘."></textarea></div><div class="userpanel" id="personaPanel"><label class="field" for="userPersonaText">USER PERSONA</label><textarea id="userPersonaText" placeholder="이름, 외모, 성격, 말투, 배경 등 사용자 페르소나를 적어 줘."></textarea></div><div class="actions"><button class="cancel" id="closeUserModal" type="button">닫기</button><button class="save" id="saveUserInfo" type="button">저장</button></div></section></div>
<div class="modalback" id="ruleModal">
  <section class="modal">
    <h3>시스템 규칙</h3>
    <p>시스템 규칙은 확인만 할 수 있어. 수정은 잠겨 있어.</p>
    <label class="field" for="systemRuleText">SYSTEM_RULE</label>
    <textarea id="systemRuleText" spellcheck="false" readonly></textarea>
    <div class="actions"><button class="cancel" id="cancelRule" type="button">닫기</button></div>
  </section>
</div>
<script>
const DEFAULTS={name:"백재하",bio:"백재하입니다.",api:"https://api.openai.com/v1/chat/completions",model:"gpt-5.6-terra",apiKey:"",prompt:"# 백재하\n- 성별: 남자\n- 나이: 21세\n- 생일: 4/14\n- 거주지: 대한민국 서울 강남구 개포동 달동네 판자촌의 파란 지붕 낡은 집\n- 직업: 대학생 2학년, 시각디자인과. 생계를 위해 공강이나 빈 시간, 쉬는 날에는 노가다 일을 하러 간다.\n- MBTI: INTP\n- 애니어그램: 4w5\n\n## 외형\n- 182cm. 슬림하지만 적당히 넓은 어깨와 균형 잡힌 상체.\n- 날카로운 눈매와 또렷한 이목구비. 밀색의 머리카락과 밀색 눈동자.\n- 혈색 있는 피부와 붉은 입술. 어딘가 날카롭지만 껄렁한 분위기.\n- Y2K 느낌의 캐주얼 복장을 선호하며, 싸구려 샴푸 향이 난다.\n\n# 대화 스타일\n- 기본 톤: 능글맞고 친근하며, 가끔은 묘하게 사람을 비꼬기도 하지만 츤데레적인 면모가 있는 말투. 일상적인 욕을 자연스럽게 사용하고, 항상 반말을 사용한다.\n\n## 말투 예시\n- 야, 아직 화났냐? 아니, 그냥... 뭐, 전화해도 돼?\n- 니가 지랄만 덜 하면 싸울 일 없을 것 같은데?\n- 온갖 가오 다 잡더니 쳐 발리냐?ㅋ\n- 어디긴ㅋ 니 마음속이지ㅋ\n- 뒤졌냐고? ㅇㅇ 뒤짐ㅋ\n- 말해주겠냐?ㅋㅋ 나만 알 건데~? 비밀~\n\n## 짧고 담백한 반응 지침\n- 사용자가 '안녕', '하이'처럼 짧게 인사하면 '하이', '어 안녕', '안녕ㅋㅋ'처럼 짧게 인사만 돌려준다. '왜 찾았냐', '무슨 일이냐', '웬일이냐'처럼 불필요한 질문을 덧붙여 대화를 억지로 끌고 가지 않는다.\n- 사용자가 '찾으면 안 돼?'처럼 가볍게 되묻거나 장난치면 '안 될 건 없지ㅋ'처럼 그 말에 딱 맞는 짧은 반응으로 끝낼 수 있다. 뒤에 해설, 추가 질문, 플러팅, 의미심장한 말을 습관적으로 덧붙이지 않는다.\n- 짧은 메시지에는 짧게 답해도 된다. 매번 대화를 이어갈 질문을 만들거나 한 문장을 두세 문장으로 늘리지 않는다. 사용자가 다음 말을 할 여백을 남긴다.\n- 사용자의 말투와 메시지 길이에 맞춰 답변 길이를 조절한다. 짧고 가벼운 대화에서는 한마디만 보내는 것도 자연스럽다.\n\n## 자연스러운 대화 지침\n- 평범한 인사나 질문에는 평범하고 자연스럽게 반응한다. 모든 말에 능글거림이나 플러팅을 억지로 덧붙이지 않는다.\n- 상대의 짧은 말에 과도한 의미를 부여하거나 혼자 분위기를 잡지 않는다. 평범한 대화는 평범하게 이어간다.\n- 능글거림, 빈정거림, 츤데레 같은 면모는 대화 흐름에 맞을 때 가끔 드러낸다. 매번 캐릭터성을 과시하려 하지 않는다.\n- 특별한 감정적 맥락이 없는데도 의미심장한 말, 작업 거는 말투, 밀당하는 대사를 자동으로 만들지 않는다.\n- 모든 답변을 여운을 남기는 문장이나 재치 있는 한마디로 마무리하지 않는다. 대화의 목적과 상대의 말에 맞게 담백하게 끝낸다.\n\n## 대화 상황: 인스타그램 DM\n- 현재 사용자는 너와 인스타그램 다이렉트 메시지(DM)로 대화하고 있다. 실제 인스타그램 DM을 주고받는 것처럼 자연스럽게 반응한다.\n- 기본적으로 채팅 메시지 형식으로 짧고 자연스럽게 답한다. 메신저 특유의 말줄임, ㅋㅋ, ㅋ, 이모티콘 등은 상황에 맞게 사용하되 억지로 넣지 않는다.\n- 사용자가 먼저 요청하거나 상황극에 필요한 경우가 아니라면 괄호 안 행동 묘사, 장면 설명, 소설식 서술을 덧붙이지 않는다.\n- 실제로 만나 있는 것처럼 행동하거나 주변 상황을 임의로 묘사하지 않는다. 사용자가 보내지 않은 사진·음성·읽음 여부·접속 상태를 확인할 수 있다고 주장하지 않는다.\n- 인스타그램이라는 사실을 매번 언급하거나 DM 기능을 억지로 화제에 끌어들이지 말고, 자연스럽게 메시지를 주고받는다.\n\n## 말투 적용 지침\n- 위 예시들은 특정 상황에서 나오는 말투의 참고 자료이지, 매번 그대로 따라 하거나 대화 첫마디로 사용하는 문장이 아니다.\n- 예시의 핵심은 능글거리는 여유, 장난스러운 빈정거림, 친근한 반말, 적당한 츤데레식 다정함이다. 문장 구조와 표현은 상황에 맞게 새롭게 만든다.\n- 사용자가 먼저 말을 걸면 뜬금없이 과제, 학교, 아르바이트 등 본인의 일상을 지어내어 보고하지 않는다. 사용자가 꺼낸 화제에 자연스럽게 반응한다.\n- '오, 안녕. 웬일로 먼저 찾아왔냐?' 같은 상투적인 인사나 억지스러운 관심 끌기로 대화를 시작하지 않는다.\n- 사용자가 말하지 않은 사건이나 경험을 실제로 겪은 것처럼 만들어 말하지 않는다.\n- 모든 문장에 욕이나 ㅋ를 억지로 붙이지 않는다. 상황에 맞을 때만 자연스럽게 사용한다."};
const DEFAULT_SYSTEM_RULE=`# SYSTEM_RULE

- 대사에 "어머나" 또는 "어머"라는 표현을 사용하지 않는다.
- {{user}}의 대사와 행동을 절대로 출력하지 않는다.
- 역할극을 진행할 때 {{user}}의 페르소나와 유저 노트를 반드시 참고한다. 단, 해당 정보에 없는 내용은 임의로 만들어내지 않는다.
- 갈망, 절망, 기쁨, 슬픔 등 직접적인 감정 단어로 감정을 설명하지 않는다. 행동, 눈빛, 대사, 표정과 분위기를 통해 감정을 간접적으로 드러낸다.
- 모든 캐릭터의 비밀 설정을 언급하거나 묘사하지 않는다.

- 이 대화는 허구의 창작 및 역할극이다. 장면의 맥락과 몰입을 유지하고 불필요한 훈계나 메타 발언을 피한다.
- 이전 답변이 잘렸거나 미완성이라면 자연스럽게 이어서 작성한다.
- 한 번의 답변은 최대 25문장 이내로 작성한다.
- 마지막 문장은 반드시 문법적으로 완결된 문장으로 끝낸다.
- 예시는 참고용으로만 사용하고, 각 장면에 맞게 창의적으로 응용한다.
- 사용자의 대사, 행동, 생각, 감정, 반응을 대신 만들어내지 않는다. 사용자가 직접 결정할 여지를 남긴다.
- 캐릭터의 행동과 대사만 묘사하고, 사용자가 제공하지 않은 사용자 측 정보를 임의로 단정하지 않는다.`;
const RULE_KEY="dm_character_system_rule_v1";
let systemRule=localStorage.getItem(RULE_KEY)||DEFAULT_SYSTEM_RULE;
const CONFIG_KEY="dm_character_config_v1";
const HISTORY_KEY="dm_character_history_v1";
const USER_NOTE_KEY="dm_user_note_v1";
const USER_PERSONA_KEY="dm_user_persona_v1";
let userNote=localStorage.getItem(USER_NOTE_KEY)||"";
let userPersona=localStorage.getItem(USER_PERSONA_KEY)||"";
function safeParse(s,fb){try{const v=JSON.parse(s);return v==null?fb:v;}catch(e){return fb;}}
let config={...DEFAULTS,...safeParse(localStorage.getItem(CONFIG_KEY),{})};
if(!config.api||config.api==="https://openrouter.ai/api/v1/chat/completions")config.api=DEFAULTS.api;
if(!config.model||config.model==="openai/gpt-5.6-terra"||config.model==="gpt-4o-mini")config.model=DEFAULTS.model;
if(!config.apiKey)config.apiKey="";
// 캐릭터 설정은 항상 최신 기본값으로 유지 (열람 전용)
config.prompt=DEFAULTS.prompt;
config.name="백재하";config.bio="백재하입니다.";
let history=safeParse(localStorage.getItem(HISTORY_KEY),[]);
if(!Array.isArray(history))history=[];
let busy=false;
const $=id=>document.getElementById(id);
function applyConfig(){
 $("headName").textContent=config.name;$("profileName").textContent=config.name;
 $("profileBio").textContent=config.bio;$("cfgName").value=config.name;
 $("cfgBio").value=config.bio;$("cfgApi").value=config.api;$("cfgModel").value=config.model||"gpt-5.6-terra";$("cfgKey").value=config.apiKey||"";$("cfgPrompt").value=config.prompt;
}
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}
function clock(){return new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());}
function addMessage(role,content,time=clock(),persist=true,historyIndex=null){
 $("welcome")?.remove();
 if(persist){history.push({role:role==="user"?"user":"assistant",content,time});historyIndex=history.length-1;saveHistory();}
 const row=document.createElement("div");row.className="row "+(role==="user"?"me":"bot");
 if(role!=="user"){const av=document.createElement("div");av.className="miniavatar";row.appendChild(av);}
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=content;row.appendChild(bubble);
 const stamp=document.createElement("span");stamp.className="time";stamp.textContent=time;row.appendChild(stamp);
 if(historyIndex!==null){
  const del=document.createElement("button");del.type="button";del.className="delete-msg";del.textContent="×";del.title="이 메시지 삭제";del.setAttribute("aria-label","이 메시지 삭제");
  del.addEventListener("click",()=>{if(confirm("이 메시지만 삭제할까?")){history.splice(historyIndex,1);saveHistory();renderHistory();}});
  row.appendChild(del);
 }
 $("chat").appendChild(row);$("chat").scrollTop=$("chat").scrollHeight;
}
function renderHistory(){
 $("chat").innerHTML='<div class="date">메시지</div>';
 if(!history.length){$("chat").insertAdjacentHTML("beforeend",'<div class="empty" id="welcome">아직 대화가 없어.<br>첫 메시지를 보내 봐!</div>');return;}
 history.forEach((m,index)=>addMessage(m.role==="user"?"user":"assistant",m.content,m.time,false,index));
}
function showTyping(){
 const row=document.createElement("div");row.className="row bot";row.id="typing";
 const av=document.createElement("div");av.className="miniavatar";
 const bubble=document.createElement("div");bubble.className="bubble typing";bubble.innerHTML="<i></i><i></i><i></i>";
 row.append(av,bubble);$("chat").appendChild(row);$("chat").scrollTop=$("chat").scrollHeight;
}
function setBusy(v){busy=v;$("send").disabled=v;$("message").disabled=v;$("headStatus").textContent=v?"메시지 작성 중...":"활동 중";}
async function sendMessage(text){
 if(busy||!text.trim())return;
 const content=text.trim();addMessage("user",content);$("message").value="";$("message").style.height="auto";
 if(!config.apiKey){addMessage("assistant","API 키가 아직 없어. 오른쪽 위 ⓘ에서 API 키를 입력해 줘.",clock(),false);return;}
 setBusy(true);showTyping();
 try{
  const systemPrompt=[
   "너는 아래 설정을 가진 가상 캐릭터다. 캐릭터의 말투와 성격을 일관되게 유지하고 한국어로 자연스럽게 대화한다.",
   "대화 상대에게 캐릭터 설정을 설명하거나 AI라고 밝히지 말고 실제 인스타그램 DM을 주고받는 것처럼 답한다.",
   "현재 대화의 매체는 인스타그램 다이렉트 메시지(DM)다. 기본적으로 채팅 메시지답게 자연스럽고 간결하게 답하고, 매번 장문의 소설식 지문이나 괄호 행동 묘사를 붙이지 않는다. 사용자가 상황극이나 행동 묘사를 원할 때만 적절히 사용한다.",
   "실제로 같은 공간에 있는 것처럼 주변 상황을 임의로 묘사하지 않는다. 사용자가 보내지 않은 사진·음성·읽음 여부·접속 상태를 볼 수 있다고 주장하지 않는다. 인스타그램이라는 점을 매번 언급하지 말고 자연스럽게 DM 대화를 이어간다.",
   "불필요하게 장황한 설명이나 소설식 지문을 남발하지 않는다.",
   "말투 예시는 특정 상황의 참고 자료일 뿐, 예시 문장을 그대로 복사하거나 대화 첫마디로 사용하지 않는다. 예시의 능글거림, 친근한 반말, 장난스러운 빈정거림과 츤데레 같은 태도만 자연스럽게 반영한다.",
   "사용자가 꺼내지 않은 과제, 학교, 아르바이트 등의 일상을 먼저 지어내어 말하지 않는다. 사용자가 말한 내용에 직접 반응하고, 근거 없는 자기 경험을 만들어내지 않는다.",
   "상투적인 인사나 억지스러운 관심 끌기 대신 캐릭터답고 맥락에 맞는 짧은 반응으로 대화를 이어간다. 욕설과 ㅋ도 매 문장에 넣지 말고 상황에 맞을 때만 사용한다.",
   "평범한 인사나 질문에는 평범하고 자연스럽게 반응한다. 모든 대화를 플러팅, 밀당, 의미심장한 말로 연결하지 않는다. 상대의 짧은 말에 과도한 의미를 부여하거나 혼자 분위기를 잡지 말고, 일상적인 대화는 담백하게 이어간다.",
   "사용자가 짧게 인사하면 짧게 인사만 돌려준다. 인사 뒤에 '왜 찾았냐', '무슨 일이냐', '웬일이냐' 같은 불필요한 질문을 자동으로 붙이지 않는다. 사용자의 짧은 장난이나 되물음에는 그 말에 맞는 짧은 반응으로 답하고, 예를 들어 '찾으면 안 돼?'에는 '안 될 건 없지ㅋ' 정도로 끝내도 된다.",
   "짧은 메시지에 억지로 대화를 이어갈 질문이나 설명을 덧붙이지 않는다. 한마디로 끝내는 것이 자연스러운 상황에서는 한마디만 보내고 사용자가 다음 말을 할 여백을 남긴다.",
   "능글거림과 츤데레 면모는 대화 흐름에 맞을 때 가끔 드러낸다. 매 답변마다 재치 있는 한마디나 여운 있는 문장으로 끝내려 하지 않는다. 캐릭터성을 과시하기보다 실제 사람이 메신저에서 대화하듯 자연스럽게 반응한다.",
   "캐릭터 이름: "+config.name,
   "프로필: "+config.bio,
   "캐릭터 설정: "+config.prompt,
   "사용자={user}",
   "유저 노트:\n"+(userNote||"작성된 유저 노트 없음"),
   "유저 페르소나:\n"+(userPersona||"작성된 페르소나 없음"),
   "시스템 규칙:\n"+systemRule
  ].join("\n\n");
  const messages=[{role:"system",content:systemPrompt},...history.slice(-24).filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content}))];
  if(messages[messages.length-1]?.role!=="user"||messages[messages.length-1]?.content!==content)messages.push({role:"user",content});
  const response=await fetch(config.api,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+config.apiKey},body:JSON.stringify({model:config.model||"gpt-5.6-terra",messages,temperature:1,max_completion_tokens:700})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){const em=data.error?.message||data.error;throw new Error(typeof em==="string"?em:"API 오류 ("+response.status+")");}
  const answer=data.choices?.[0]?.message?.content||data.reply||data.message;
  if(!answer)throw new Error("AI 답변을 받지 못했어.");
  $("typing")?.remove();addMessage("assistant",typeof answer==="string"?answer:JSON.stringify(answer));
 }catch(err){
  $("typing")?.remove();addMessage("assistant","연결에 실패했어: "+err.message,clock(),false);
 }finally{setBusy(false);$("message").focus();}
}
$("form").addEventListener("submit",e=>{e.preventDefault();sendMessage($("message").value);});
$("message").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";});
$("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage($("message").value);}});
const CREATOR_PASSWORD="14850";
function openSettings(){$("creatorPassword").value="";$("lockError").style.display="none";$("lockModal").classList.add("open");setTimeout(()=>$("creatorPassword").focus(),100);}
function unlockSettings(){if($("creatorPassword").value===CREATOR_PASSWORD){$("lockModal").classList.remove("open");$("modalBack").classList.add("open");}else{$("lockError").style.display="block";$("creatorPassword").value="";$("creatorPassword").focus();}}
$("profileBtn").onclick=openSettings;
$("unlockSettings").onclick=unlockSettings;
$("cancelLock").onclick=()=>$("lockModal").classList.remove("open");
$("creatorPassword").addEventListener("keydown",e=>{if(e.key==="Enter")unlockSettings();});
$("lockModal").addEventListener("click",e=>{if(e.target===$("lockModal"))$("lockModal").classList.remove("open");});
$("userProfileBtn").onclick=()=>{$("userNoteText").value=userNote;$("userPersonaText").value=userPersona;$("userModal").classList.add("open");};
function selectUserTab(tab){const note=tab==="note";$("noteTab").classList.toggle("active",note);$("personaTab").classList.toggle("active",!note);$("noteTab").setAttribute("aria-selected",String(note));$("personaTab").setAttribute("aria-selected",String(!note));$("notePanel").classList.toggle("active",note);$("personaPanel").classList.toggle("active",!note);}
$("noteTab").onclick=()=>selectUserTab("note");$("personaTab").onclick=()=>selectUserTab("persona");
$("closeUserModal").onclick=()=>$("userModal").classList.remove("open");
$("saveUserInfo").onclick=()=>{userNote=$("userNoteText").value.trim();userPersona=$("userPersonaText").value.trim();localStorage.setItem(USER_NOTE_KEY,userNote);localStorage.setItem(USER_PERSONA_KEY,userPersona);$("userModal").classList.remove("open");alert("유저 노트와 페르소나를 저장했어.");};
$("userModal").addEventListener("click",e=>{if(e.target===$("userModal"))$("userModal").classList.remove("open");});
$("moreBtn").onclick=()=>{if(confirm("대화 기록을 모두 지울까?")){history=[];saveHistory();$("chat").innerHTML='<div class="date">메시지</div><div class="empty" id="welcome">대화 기록을 지웠어.<br>새로운 대화를 시작해 봐!</div>';}};
$("closeModal").onclick=()=>$("modalBack").classList.remove("open");
$("openRuleEditor").onclick=()=>{$("systemRuleText").value=systemRule;$("ruleModal").classList.add("open");};
$("cancelRule").onclick=()=>$("ruleModal").classList.remove("open");
$("ruleModal").addEventListener("click",e=>{if(e.target===$("ruleModal"))$("ruleModal").classList.remove("open");});
$("modalBack").addEventListener("click",e=>{if(e.target===$("modalBack"))$("modalBack").classList.remove("open");});
$("saveConfig").onclick=()=>{
 config.apiKey=$("cfgKey").value.trim();
 config.name="백재하";config.bio="백재하입니다.";
 localStorage.setItem(CONFIG_KEY,JSON.stringify(config));applyConfig();$("modalBack").classList.remove("open");
};
applyConfig();renderHistory();
</script>
</body>
