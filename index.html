<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DM</title>
<style>
:root{--ink:#262626;--muted:#8e8e8e;--line:#efefef;--blue:#3797f0;--bg:#fff;--bubble:#efefef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink);background:#fafafa}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:620px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px #00000008;overflow:hidden}
.topbar{height:62px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:13px;background:#fff;z-index:2}
.back{border:0;background:none;font-size:25px;padding:4px 5px 4px 0;color:#262626}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);padding:2px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.headinfo{min-width:0;flex:1}.name{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:var(--muted);margin-top:3px}
.iconbtn{border:0;background:none;font-size:22px;padding:7px;color:#262626}
.profile{padding:25px 16px 20px;text-align:center;border-bottom:1px solid var(--line)}
.bigavatar{width:82px;height:82px;border-radius:50%;margin:0 auto 11px;padding:3px;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}
.bigavatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.profile h2{font-size:14px;margin:0 0 5px}.profile p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.chat{flex:1;overflow-y:auto;padding:18px 15px 22px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.date{text-align:center;font-size:10px;color:#a8a8a8;margin:5px 0 12px}
.row{display:flex;align-items:flex-end;gap:7px;max-width:86%;animation:pop .16s ease-out}.row.me{align-self:flex-end;flex-direction:row-reverse}.row.bot{align-self:flex-start}
.miniavatar{width:25px;height:25px;border-radius:50%;background:#f2e9ef url('1795535148960.png') center/cover no-repeat;display:grid;place-items:center;font-size:10px;font-weight:700;color:#777;flex-shrink:0}
.bubble{padding:11px 14px;border-radius:20px;background:var(--bubble);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.me .bubble{background:linear-gradient(135deg,#3797f0,#7b61ff);color:#fff;border-bottom-right-radius:6px}
.bot .bubble{border-bottom-left-radius:6px}
.time{font-size:9px;color:#b0b0b0;margin:0 5px 3px;align-self:flex-end}
.typing{display:flex;gap:4px;padding:14px 16px}.typing i{width:5px;height:5px;border-radius:50%;background:#999;animation:bounce .8s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.composer-wrap{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;flex-shrink:0}
.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid #dbdbdb;border-radius:25px;padding:6px 7px 6px 15px;min-height:44px}
#message{flex:1;resize:none;border:0;outline:0;max-height:110px;min-height:28px;padding:6px 0;background:transparent;font-size:14px;line-height:1.4;color:var(--ink)}
#message::placeholder{color:#aaa}
.send{border:0;border-radius:22px;background:var(--blue);color:white;font-size:13px;font-weight:650;padding:9px 15px;min-width:55px}.send:disabled{opacity:.4}
.bottomhint{text-align:center;font-size:10px;color:#b4b4b4;padding-top:7px}
.empty{margin:auto;text-align:center;color:#999;font-size:13px;line-height:1.7}
.notice{margin:8px auto;padding:8px 12px;background:#fff8e7;border:1px solid #f5e5b9;border-radius:10px;font-size:11px;color:#8c6b24;line-height:1.5;max-width:95%}
.modalback{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}.modalback.open{display:flex}#ruleModal{z-index:7}#cfgPrompt{min-height:110px}#systemRuleText{min-height:260px;line-height:1.55}
.modal{width:min(620px,100%);background:white;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{font-size:12px;color:#888;line-height:1.5;margin:0 0 16px}
.field{display:block;font-size:12px;font-weight:650;margin:13px 0 6px}.modal input,.modal textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:13px;outline-color:var(--blue)}.modal textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:17px}.actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:650}.save{background:#262626;color:#fff}.cancel{background:#f2f2f2;color:#333}
@keyframes bounce{to{transform:translateY(-4px);opacity:.45}}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:621px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border:1px solid #eee;border-radius:12px}.modalback{align-items:center}.modal{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" aria-label="뒤로">‹</button>
    <div class="avatar"><img src="1795535148960.png" alt="백재 프로필 사진"></div>
    <div class="headinfo"><div class="name" id="headName">백재하</div><div class="status" id="headStatus">활동 중</div></div>
    <button class="iconbtn" id="profileBtn" aria-label="프로필 설정">ⓘ</button>
    <button class="iconbtn" id="moreBtn" aria-label="메뉴">⋯</button>
  </header>
  <section class="profile">
    <div class="bigavatar"><img src="1795535148960.png" alt="백재 프로필 사진"></div>
    <h2 id="profileName">백재하</h2>
    <p id="profileBio">당신이 대화하고 싶은 캐릭터</p>
    <p>Instagram 대화 스타일</p>
  </section>
  <main class="chat" id="chat">
    <div class="date">메시지</div>
    <div class="empty" id="welcome">아직 대화가 없어.<br>첫 메시지를 보내 봐!</div>
  </main>
  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea id="message" rows="1" placeholder="메시지 보내기..." autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">보내기</button>
    </form>
    <div class="bottomhint">대화 내용은 이 기기에 자동 저장돼</div>
  </div>
</div>
<div class="modalback" id="modalBack">
  <section class="modal">
    <h3>대화 설정</h3>
    <p>여기서 API 주소, 모델, 키까지 한 번에 설정해. 키는 이 브라우저에만 저장돼.</p>
    <label class="field" for="cfgName">캐릭터 이름</label><input id="cfgName" maxlength="30" placeholder="예: 에이든">
    <label class="field" for="cfgBio">프로필 한 줄 소개</label><input id="cfgBio" maxlength="80" placeholder="예: 말수가 적고 무심한 성격">
    <label class="field" for="cfgApi">API 주소</label><input id="cfgApi" type="url" placeholder="https://openrouter.ai/api/v1/chat/completions"><label class="field" for="cfgModel">모델 이름</label><input id="cfgModel" placeholder="openai/gpt-5.6-terra"><label class="field" for="cfgKey">API 키</label><input id="cfgKey" type="password" autocomplete="off" placeholder="OpenRouter 키 (sk-or-v1-...)">
    <label class="field" for="cfgPrompt">캐릭터 성격 / 말투 / 설정</label><textarea id="cfgPrompt" placeholder="캐릭터의 성격, 말투, 관계, 배경 등을 적어 줘."></textarea>
    <div class="actions"><button class="cancel" id="openRuleEditor" type="button">시스템 규칙 편집</button><button class="cancel" id="closeModal" type="button">닫기</button><button class="save" id="saveConfig" type="button">저장</button></div>
  </section>
</div>
<div class="modalback" id="ruleModal">
  <section class="modal">
    <h3>시스템 규칙</h3>
    <p>캐릭터 설정과 별도로 저장되는 최상위 역할극 규칙이야. 이 규칙은 AI에게 매 응답마다 전달돼.</p>
    <label class="field" for="systemRuleText">SYSTEM_RULE</label>
    <textarea id="systemRuleText" spellcheck="false"></textarea>
    <div class="actions"><button class="cancel" id="cancelRule" type="button">취소</button><button class="save" id="saveRule" type="button">규칙 저장</button></div>
  </section>
</div>
<script>
const DEFAULTS={name:"백재하",bio:"당신이 대화하고 싶은 캐릭터",api:"https://openrouter.ai/api/v1/chat/completions",model:"openai/gpt-5.6-terra",apiKey:"",prompt:"아직 캐릭터 설정이 입력되지 않았습니다. 사용자가 설정을 입력하기 전에는 캐릭터의 과거나 관계를 임의로 지어내지 말고, 자연스럽게 대화를 시작하세요."};
const DEFAULT_SYSTEM_RULE=`# SYSTEM_RULE

- 이 대화는 허구의 창작 및 역할극이다. 장면의 맥락과 몰입을 유지하고 불필요한 훈계나 메타 발언을 피한다.
- 이전 답변이 잘렸거나 미완성이라면 자연스럽게 이어서 작성한다.
- 한 번의 답변은 최대 25문장 이내로 작성한다.
- 마지막 문장은 반드시 문법적으로 완결된 문장으로 끝낸다.
- 예시는 참고용으로만 사용하고, 각 장면에 맞게 창의적으로 응용한다.
- 사용자의 대사, 행동, 생각, 감정, 반응을 대신 만들어내지 않는다. 사용자가 직접 결정할 여지를 남긴다.
- 캐릭터의 행동과 대사만 묘사하고, 사용자가 제공하지 않은 사용자 측 정보를 임의로 단정하지 않는다.`;
const RULE_KEY="dm_character_system_rule_v1";
let systemRule=localStorage.getItem(RULE_KEY)||DEFAULT_SYSTEM_RULE;
const CONFIG_KEY="dm_character_config_v1";
const HISTORY_KEY="dm_character_history_v1";
let config={...DEFAULTS,...JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}")};
if(!config.api||config.api==="https://api.openai.com/v1/chat/completions")config.api=DEFAULTS.api;if(!config.model||config.model==="gpt-4o-mini")config.model=DEFAULTS.model;if(!config.apiKey)config.apiKey="";
if(!config.name||config.name==="캐릭터 이름"){config.name="백재하";localStorage.setItem(CONFIG_KEY,JSON.stringify(config));}
let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
let busy=false;
const $=id=>document.getElementById(id);
function initial(){return (config.name||"?").trim().slice(0,1)||"?";}
function applyConfig(){
 $("headName").textContent=config.name;$("profileName").textContent=config.name;

 $("profileBio").textContent=config.bio;$("cfgName").value=config.name;
 $("cfgBio").value=config.bio;$("cfgApi").value=config.api;$("cfgModel").value=config.model||"openai/gpt-5.6-terra";$("cfgKey").value=config.apiKey||"";$("cfgPrompt").value=config.prompt;
}
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}
function clock(){return new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());}
function addMessage(role,content,time=clock(),persist=true){
 $("welcome")?.remove();
 const row=document.createElement("div");row.className="row "+(role==="user"?"me":"bot");
 if(role!=="user"){const av=document.createElement("div");av.className="miniavatar";av.textContent="";row.appendChild(av);}
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=content;row.appendChild(bubble);
 const stamp=document.createElement("span");stamp.className="time";stamp.textContent=time;row.appendChild(stamp);
 $("chat").appendChild(row);$("chat").scrollTop=$("chat").scrollHeight;
 if(persist){history.push({role:role==="user"?"user":"assistant",content,time});saveHistory();}
}
function renderHistory(){
 if(!history.length)return;
 $("welcome")?.remove();
 history.forEach(m=>addMessage(m.role==="user"?"user":"assistant",m.content,m.time,false));
}
function showTyping(){
 const row=document.createElement("div");row.className="row bot";row.id="typing";
 const av=document.createElement("div");av.className="miniavatar";av.textContent=initial();
 const bubble=document.createElement("div");bubble.className="bubble typing";bubble.innerHTML="<i></i><i></i><i></i>";
 row.append(av,bubble);$("chat").appendChild(row);$("chat").scrollTop=$("chat").scrollHeight;
}
function setBusy(v){busy=v;$("send").disabled=v;$("message").disabled=v;$("headStatus").textContent=v?"메시지 작성 중...":"활동 중";}
async function sendMessage(text){
 if(busy||!text.trim())return;
 const content=text.trim();addMessage("user",content);$("message").value="";$("message").style.height="auto";
 if(!config.apiKey){addMessage("assistant","API 키가 아직 없어. 오른쪽 위 ⓘ에서 API 키를 입력해 줘.");return;}
 setBusy(true);showTyping();
 try{
  const systemPrompt=[
   "너는 아래 설정을 가진 가상 캐릭터다. 캐릭터의 말투와 성격을 일관되게 유지하고 한국어로 자연스럽게 대화한다.",
   "대화 상대에게 캐릭터 설정을 설명하거나 AI라고 밝히지 말고 실제 메신저 대화처럼 답한다.",
   "불필요하게 장황한 설명이나 소설식 지문을 남발하지 않는다.",
   "캐릭터 이름: "+config.name,
   "프로필: "+config.bio,
   "캐릭터 설정: "+config.prompt,
   "시스템 규칙:\n"+systemRule
  ].join("\n\n");
  const messages=[{role:"system",content:systemPrompt},...history.slice(-24).filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content}))];
  if(messages[messages.length-1]?.role!=="user"||messages[messages.length-1]?.content!==content)messages.push({role:"user",content});
  const response=await fetch(config.api,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+config.apiKey},body:JSON.stringify({model:config.model||"openai/gpt-5.6-terra",messages,temperature:0.85,max_tokens:700})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||data.error||"API 오류 ("+response.status+")");
  const answer=data.choices?.[0]?.message?.content||data.reply||data.message;
  if(!answer)throw new Error("AI 답변을 받지 못했어.");
  $("typing")?.remove();addMessage("assistant",typeof answer==="string"?answer:JSON.stringify(answer));
 }catch(err){
  $("typing")?.remove();addMessage("assistant","연결에 실패했어: "+err.message);
 }finally{setBusy(false);$("message").focus();}
}
$("form").addEventListener("submit",e=>{e.preventDefault();sendMessage($("message").value);});
$("message").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";});
function openSettings(){$("modalBack").classList.add("open");}
$("profileBtn").onclick=openSettings;$("moreBtn").onclick=()=>{if(confirm("대화 기록을 모두 지울까?")){history=[];saveHistory();$("chat").innerHTML='<div class="date">메시지</div><div class="empty" id="welcome">대화 기록을 지웠어.<br>새로운 대화를 시작해 봐!</div>';}}
$("closeModal").onclick=()=>$("modalBack").classList.remove("open");
$("openRuleEditor").onclick=()=>{$("systemRuleText").value=systemRule;$("ruleModal").classList.add("open");};
$("cancelRule").onclick=()=>$("ruleModal").classList.remove("open");
$("saveRule").onclick=()=>{systemRule=$("systemRuleText").value.trim()||DEFAULT_SYSTEM_RULE;localStorage.setItem(RULE_KEY,systemRule);$("ruleModal").classList.remove("open");alert("시스템 규칙을 저장했어.");};
$("ruleModal").addEventListener("click",e=>{if(e.target===$("ruleModal"))$("ruleModal").classList.remove("open");});
$("modalBack").addEventListener("click",e=>{if(e.target===$("modalBack"))$("modalBack").classList.remove("open");});
$("saveConfig").onclick=()=>{
 config={name:$("cfgName").value.trim()||DEFAULTS.name,bio:$("cfgBio").value.trim()||DEFAULTS.bio,api:$("cfgApi").value.trim(),model:$("cfgModel").value.trim()||DEFAULTS.model,apiKey:$("cfgKey").value.trim(),prompt:$("cfgPrompt").value.trim()||DEFAULTS.prompt};
 localStorage.setItem(CONFIG_KEY,JSON.stringify(config));applyConfig();$("modalBack").classList.remove("open");
};
applyConfig();renderHistory();
</script>
</body>
</html>
